<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ilmoittautuminen – Lapuan Lepakot</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Ilmoittautuminen</h1>
    <nav aria-label="Päänavigaatio">
      <ul>
        <li><a href="index.html">Etusivu</a></li>
        <li><a href="contact.html">Ilmoittautuminen</a></li>
        <li><a href="about.html">Tietoa meistä</a></li>
        <li><a href="listing.html">Tulevat pelit</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form id="ilmoittautuminen" novalidate>
      <div class="kentta">
        <label for="etunimi">Etunimi:</label>
        <input id="etunimi" name="etunimi" type="text" required>
      </div>

      <div class="kentta">
        <label for="sukunimi">Sukunimi:</label>
        <input id="sukunimi" name="sukunimi" type="text" required>
      </div>

      <div class="kentta">
        <label for="puhelin">Puhelin:</label>
        <input id="puhelin" name="puhelin" type="tel" required>
      </div>

      <div class="kentta">
        <label for="sahkoposti">Sähköposti:</label>
        <input id="sahkoposti" name="sahkoposti" type="email" required>
      </div>

      <div class="kentta">
        <label for="joukkue">Joukkue:</label>
        <select id="joukkue" name="joukkue" required>
          <option value="">Valitse joukkue</option>
          <option value="naiset">Naiset</option>
          <option value="miehet">Miehet</option>
          <option value="juniorit">Juniorit</option>
        </select>
      </div>

      <p id="virhe" role="alert" class="virhe"></p>
      <button type="submit">Tarkista ilmoittautuminen</button>
      <p id="onnistuminen" role="status" class="onnistuminen"></p>
      <p>Ilmoittautumista ei lähetetä tällä sivulla.</p>
    </form>
  </main>

  <footer>
    <p>&copy; 2023 Lapuan Lepakot. Kaikki oikeudet pidätetään.</p>
  </footer>
</body>
</html>
